[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
priority=10
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:tailscaled]
command=/usr/local/bin/tailscaled --tun=userspace-networking --state=/var/lib/tailscale/tailscaled.state --statedir=/var/lib/tailscale --socket=/run/tailscale/tailscaled.sock
priority=20
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:desktop-session]
command=/usr/local/sbin/run-codex-session
user=codex
environment=HOME="/home/codex",USER="codex",LOGNAME="codex",SHELL="/bin/bash",CODEX_HOME="/home/codex/.codex",CHROME_REMOTE_DESKTOP_USE_XVFB="1",LIBGL_ALWAYS_SOFTWARE="1"
priority=30
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:remote-browser-owner]
command=/usr/local/sbin/run-codex-chrome
user=codex
environment=HOME="/home/codex",USER="codex",LOGNAME="codex",SHELL="/bin/bash",CODEX_HOME="/home/codex/.codex",CODEX_CHROME_PROFILE_DIR="/home/codex/.config/remote-browser/chrome-profile",REMOTE_BROWSER_RUNTIME_DIR="/run/remote-browser/browser",REMOTE_BROWSER_BROWSER_ENDPOINT="/run/remote-browser/browser/endpoint.sock",NODE_PATH="/usr/local/lib/node_modules/@playwright/mcp/node_modules:/usr/local/lib/node_modules"
priority=35
autorestart=true
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:remote-browser-gateway]
command=/opt/codex-desktop/remote-browser/run-gateway.sh
priority=40
autorestart=true
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:remote-browser-guest-access]
command=/usr/local/libexec/remote-browser-guest-access
priority=45
autorestart=true
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=25
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/usr/local/sbin/run-codex-x11vnc
user=codex
environment=HOME="/home/codex",USER="codex",LOGNAME="codex",SHELL="/bin/bash"
priority=50
autorestart=true
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/local/sbin/run-codex-novnc
priority=55
autorestart=true
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:playwright-mcp]
command=/opt/codex-desktop/remote-browser/run-playwright-mcp.sh
user=codex
environment=HOME="/home/codex",USER="codex",LOGNAME="codex",SHELL="/bin/bash",CODEX_HOME="/home/codex/.codex",CODEX_CHROME_PROFILE_DIR="/home/codex/.config/remote-browser/chrome-profile",REMOTE_BROWSER_RUNTIME_DIR="/run/remote-browser/browser",REMOTE_BROWSER_BROWSER_ENDPOINT="/run/remote-browser/browser/endpoint.sock",REMOTE_BROWSER_PLAYBOOK="/opt/codex-desktop/remote-browser/browser-playbook.md"
priority=60
autorestart=true
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:remote-browser-keeper]
command=/usr/local/bin/node /opt/codex-desktop/remote-browser/mcp-keeper.cjs
user=codex
environment=HOME="/home/codex",USER="codex",LOGNAME="codex",SHELL="/bin/bash",REMOTE_BROWSER_INTERNAL_MCP_URL="http://127.0.0.2:8932/mcp",REMOTE_BROWSER_KEEPER_READY_FILE="/run/remote-browser/browser/keeper.ready",REMOTE_BROWSER_KEEPER_INTERVAL_MS="1000"
priority=65
autorestart=true
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
