name: codex-desktop

services:
  desktop:
    image: ${IMAGE_REF:?Set IMAGE_REF in /etc/codex-desktop/deploy.env}
    hostname: ${CONTAINER_HOSTNAME:-codex-desktop}
    init: false
    environment:
      HOME: /home/codex
      USER: codex
      LOGNAME: codex
      SHELL: /bin/bash
      CODEX_HOME: /home/codex/.codex
      CODEX_CHROME_PROFILE_DIR: /home/codex/.config/google-chrome
      TZ: ${TZ:-Etc/UTC}
      TS_STATE_DIR: /var/lib/tailscale
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME:-codex-desktop}
      CHROME_REMOTE_DESKTOP_DEFAULT_DESKTOP_SIZES: ${DESKTOP_SIZES:-1920x1080,2560x1440}
      CHROME_REMOTE_DESKTOP_USE_XVFB: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      REMOTE_BROWSER_EDGE_COMPAT: ${REMOTE_BROWSER_EDGE_COMPAT:-0}
      REMOTE_BROWSER_TAILSCALE_SERVE: ${REMOTE_BROWSER_TAILSCALE_SERVE:-1}
      REMOTE_BROWSER_GUEST_ACCESS_ENABLED: ${REMOTE_BROWSER_GUEST_ACCESS_ENABLED:-1}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - KILL
      - SETGID
      - SETUID
    security_opt:
      # Ubuntu 24.04 AppArmor and Docker's default seccomp profile restrict the
      # unprivileged user namespaces required by the Codex Electron sandbox.
      # Keep Chromium's sandbox enabled and retain Docker namespaces,
      # no-new-privileges, the capability allowlist, and no published ports.
      - apparmor=unconfined
      - seccomp=unconfined
      - no-new-privileges:true
    volumes:
      - type: bind
        source: /var/lib/codex-desktop/home
        target: /home/codex
      - type: bind
        source: /var/lib/codex-desktop/tailscale
        target: /var/lib/tailscale
      - type: bind
        source: /var/lib/codex-desktop/machine
        target: /var/lib/codex-desktop-persistent
    tmpfs:
      - /run:rw,nosuid,nodev,mode=0755
      - /tmp:rw,nosuid,nodev,mode=1777
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "/usr/local/sbin/codex-desktop-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 45s
    mem_limit: ${MEM_LIMIT:-6g}
    mem_reservation: ${MEM_RESERVATION:-1g}
    cpus: ${CPU_LIMIT:-2.0}
    pids_limit: 2048
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
