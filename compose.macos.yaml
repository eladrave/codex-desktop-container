services:
  desktop:
    # The official Linux desktop packages are currently AMD64. Docker Desktop
    # runs this image through Apple silicon's configured AMD64 emulation.
    platform: linux/amd64
    environment:
      # Go 1.26's AVX2 ChaCha20-Poly1305 path is unreliable under Rosetta 2.
      # Disable only that emulated CPU path so Tailscale control-plane Noise
      # handshakes remain valid; native AMD64 Linux keeps the optimized path.
      GODEBUG: cpu.avx2=off
    volumes:
      - type: volume
        source: codex-home
        target: /home/codex
      - type: volume
        source: codex-tailscale
        target: /var/lib/tailscale
      - type: volume
        source: codex-machine
        target: /var/lib/codex-desktop-persistent

volumes:
  codex-home:
    name: ${VOLUME_PREFIX:-codex-desktop}-home
  codex-tailscale:
    name: ${VOLUME_PREFIX:-codex-desktop}-tailscale
  codex-machine:
    name: ${VOLUME_PREFIX:-codex-desktop}-machine
