services:
  desktop:
    # Apple silicon uses a native ARM64 image. Chrome Remote Desktop is omitted
    # because Google does not publish the pinned Linux package for ARM64.
    platform: linux/arm64
    environment:
      CODEX_DESKTOP_CRD_ENABLED: "0"
      CODEX_CHROME_PROFILE_DIR: /home/codex/.config/remote-browser/chrome-profile
    volumes:
      - type: volume
        source: codex-home
        target: /home/codex
      - type: volume
        source: codex-tailscale
        target: /var/lib/tailscale
      - type: volume
        source: codex-machine
        target: /var/lib/codex-desktop-persistent

volumes:
  codex-home:
    name: ${VOLUME_PREFIX:-codex-desktop}-home
  codex-tailscale:
    name: ${VOLUME_PREFIX:-codex-desktop}-tailscale
  codex-machine:
    name: ${VOLUME_PREFIX:-codex-desktop}-machine
